# 自定义强制直连规则（behavior: classical） ayue-direct
# IP 规则必须带 no-resolve：本规则集排在第一位，否则每个连接都会先在本地解析域名，造成 DNS 泄露
payload:
  - DOMAIN-KEYWORD,ai.ayue.cc
  - DOMAIN-KEYWORD,aihub.dog
  - DOMAIN-KEYWORD,api.xgs147.com
  - DOMAIN-KEYWORD,git.ayue.cc
  - IP-CIDR,8.134.211.33/32,no-resolve
  - IP-CIDR,120.26.22.103/32,no-resolve
